<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="loging-pg.css">
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="brand" aria-hidden="true">A</div>
    <h1 id="page-title">Welcome back</h1>
    <p>Sign in to continue to your account.</p>

    <form id="login-form" novalidate>
      <div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6" />
      </div>

      <div class="row">
        <label class="check" for="remember">
          <input id="remember" name="remember" type="checkbox" />
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
      <div class="message" id="message" role="status" aria-live="polite"></div>
    </form>

    <p class="signup">New here? <a href="#">Create an account</a></p>
  </main>

  <script>
    const form = document.querySelector("#login-form");
    const message = document.querySelector("#message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!form.checkValidity()) {
        message.textContent = "Please enter a valid email and password.";
        return;
      }

      message.style.color = "#0f766e";
      message.textContent = "Looks good. This demo form is ready to connect.";
    });
  </script>
</body>
</html>
